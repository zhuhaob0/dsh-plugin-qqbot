# qqbot-supervisor：把桥接这个外部进程交给 DSH 宿主托管。
# 这里插入一条 loader 行；name 是包名（profile 目录下用 node_modules junction 解析）。
# 2026-10-31：桥接已重写为 qqbridge-v2，入口/参数/日志名都变了。
- insert:
    - id: qqbot-supervisor
      name: qqbot-supervisor
      config:
        bridgeDir: 'E:\Code\qqbridge-v2'
        bridgeScript: 'src/index.js'
        bridgeArgs: ['--config', 'config.json']
        logFile: 'state/v2.out.log'
        consolePort: 3100
        autoStart: true
